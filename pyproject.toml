[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ness-st"
version = "1.0.0"
description = "NeSS-ST: Detecting Good and Stable Keypoints with a Neural Stability Score and the Shi-Tomasi Detector"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Konstantin Pakulev"},
]
license = {text = "MIT"}

# These are the minimal dependencies needed for the standalone module.
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "scikit-image>=0.19.0",
    "torchvision>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/KonstantinPakulev/NeSS-ST"
Paper = "https://openaccess.thecvf.com/content/ICCV2023/papers/Pakulev_NeSS-ST_Detecting_Good_and_Stable_Keypoints_with_a_Neural_Stability_ICCV_2023_paper.pdf"

[tool.setuptools.packages.find]
include = ["standalone*", "standalone.*"]
